---
layout: default
---
<header class="page-hero">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body{% if page.prose %} prose{% endif %}">
  {{ content }}
</div>

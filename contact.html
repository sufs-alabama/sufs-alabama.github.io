---
permalink: /contact/
title: Contact
eyebrow: Get in touch
lede: Send us a message, join our email list, or both. It all goes straight to our inbox.
---
<div class="row g-4 g-lg-5">
  <div class="col-lg-7">
    <form class="card border-0 shadow-sm" action="https://formsubmit.co/{{ site.formsubmit_id }}" method="POST">
      <div class="card-body p-4 p-lg-5">
        <input type="hidden" name="_subject" value="New message from the SUFS Alabama website">
        <input type="hidden" name="_next" value="{{ '/contact/thanks/' | absolute_url }}">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="mb-3">
          <label class="form-label fw-bold" for="cf-name">Name</label>
          <input class="form-control" id="cf-name" type="text" name="name" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold" for="cf-email">Email</label>
          <input class="form-control" id="cf-email" type="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold" for="cf-message">Message <span class="fw-normal text-body-secondary">(optional if you're just joining the list)</span></label>
          <textarea class="form-control" id="cf-message" name="message" rows="6"></textarea>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="cf-list" name="email_list" value="Yes, add me to the email list">
          <label class="form-check-label fw-semibold" for="cf-list">Add me to the SUFS Alabama email list</label>
        </div>
        <button class="btn btn-primary" type="submit">Send</button>
        <p class="small text-body-secondary mt-3 mb-0">Prefer your own email app? Write to <a href="mailto:{{ site.email }}">{{ site.email }}</a>.</p>
      </div>
    </form>
  </div>
  <div class="col-lg-5">
    <h2 class="h4 fw-bold">Other ways to connect</h2>
    <ul>
      <li><a href="{{ site.social.instagram }}" target="_blank" rel="noopener">Instagram: @standupforsciencealabama</a></li>
      <li><a href="{{ '/events/' | relative_url }}">Our events</a></li>
    </ul>
  </div>
</div>

<header class="site-header">
  <div class="wrap header-inner">
    <nav class="site-nav" aria-label="Main">{% include nav-links.html %}</nav>
    <a class="logo header-logo" href="{{ '/' | relative_url }}">{% include logo.html %}<span class="sr-only">{{ site.title }} home</span></a>
    <div class="header-actions">
      {% include social.html %}
      <a class="btn btn-outline" href="{{ site.header_cta_link | relative_url }}">{{ site.header_cta_label }}!</a>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="mobile-menu">
      <span class="sr-only">Menu</span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </div>
  <div class="wrap mobile-menu" id="mobile-menu">
    <nav class="site-nav" aria-label="Mobile">{% include nav-links.html %}</nav>
    <div class="mobile-actions">
      {% include social.html %}
      <a class="btn btn-outline" href="{{ site.header_cta_link | relative_url }}">{{ site.header_cta_label }}!</a>
    </div>
  </div>
</header>

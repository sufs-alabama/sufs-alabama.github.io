<div class="gallery">
  {% for g in site.data.infographics %}{% if g.image %}
    <figure class="gallery-figure">
      <button class="gallery-item" data-full="{{ g.image | relative_url }}">
        <img src="{{ g.image | relative_url }}" alt="{{ g.alt | default: g.title | escape }}" loading="lazy">
      </button>
      <figcaption><strong>{{ g.title }}</strong>{% if g.caption %} {{ g.caption }}{% endif %}</figcaption>
    </figure>
  {% endif %}{% endfor %}
</div>

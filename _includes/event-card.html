{%- assign e = include.event -%}
<article class="event-card" id="{{ e.slug }}">
  <div class="event-card-inner">
    <h3><a href="{{ e.url | relative_url }}">{{ e.title }} - {{ e.date | date: "%m/%d/%Y" }}</a></h3>
    <p class="venue">{% if e.venue %}{{ e.venue }}<br>{% endif %}{{ e.city }}</p>
    <p class="desc">{{ e.summary }}</p>
  </div>
</article>

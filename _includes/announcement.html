{% if site.announcement and site.announcement != "" %}
<aside class="announcement" id="announcement" aria-label="Announcement" data-message="{{ site.announcement | slugify }}">
  <div class="wrap announcement-inner">
    {% if site.announcement_link %}<a href="{{ site.announcement_link | relative_url }}"{% if site.announcement_link contains '://' %} target="_blank" rel="noopener"{% endif %}>{{ site.announcement }}</a>{% else %}<span>{{ site.announcement }}</span>{% endif %}
    <button class="announcement-close" aria-label="Dismiss announcement">×</button>
  </div>
</aside>
{% endif %}
